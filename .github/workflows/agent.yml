# Adding the `agent` label to an issue makes Claude Code implement it and open a PR.
# Board: the card moves to "Agent doing" at the start, to "In review" when the PR is open, and back
# to "Todo" if the run fails. The label is removed at the end either way; add it again to retry.
#
# Setup:
#   secrets.PROJECT_TOKEN            classic PAT with `repo`, `project` and `workflow` scopes
#   secrets.CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token`
#   vars.PROJECT_NUMBER              the board's number, from its URL
name: Agent

on:
  issues:
    types: [labeled]

concurrency:
  group: agent-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  implement:
    # Only the owner can start an agent run (the repo is public).
    if: github.event.label.name == 'agent' && github.event.sender.login == github.repository_owner && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ISSUE: ${{ github.event.issue.number }}
      TITLE: ${{ github.event.issue.title }}
      BRANCH: agent/issue-${{ github.event.issue.number }}
      OWNER: ${{ github.repository_owner }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false # Claude gets no push access; the PR step pushes with the PAT

      # Copy the board script out of the checkout before Claude runs, so later steps that hold the
      # PAT never execute a version Claude could have edited.
      - name: Move card to Agent doing
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          cp .github/scripts/set-status.sh "$RUNNER_TEMP/set-status.sh"
          "$RUNNER_TEMP/set-status.sh" "$ISSUE" "Agent doing"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: issue
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          {
            echo 'text<<__ISSUE_EOF__'
            gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json title,body --jq '"# " + .title + "\n\n" + .body'
            echo '__ISSUE_EOF__'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # ponytail: full tool access is acceptable on a throwaway runner whose only token is read-only.
          claude_args: --permission-mode bypassPermissions --max-turns 300
          prompt: |
            Implement GitHub issue #${{ env.ISSUE }} in this repository. The issue:

            ${{ steps.issue.outputs.text }}

            Work in the current checkout. CLAUDE.md holds this repo's standards and Definition of
            done: follow it. Read SPEC.md and CONTEXT.md as the issue says. Meet every acceptance
            criterion in the issue. `pnpm typecheck`, `pnpm lint` and `pnpm test` must all pass
            before you finish.
            Do not commit, push or open a PR: the workflow does that. When done, write the PR
            description to PR_BODY.md at the repo root, in the format CLAUDE.md gives under
            "Pull requests", without the `Closes` line (the workflow adds it).

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          { echo "Closes #$ISSUE"; echo; cat PR_BODY.md 2>/dev/null; echo; echo '🤖 Generated with [Claude Code](https://claude.com/claude-code)'; } > "$body"
          rm -f PR_BODY.md
          # Agents may change ci.yml (visible in review) but never the automation that runs them.
          git checkout HEAD -- .github/workflows/agent.yml .github/workflows/review.yml .github/scripts
          git add -A
          git diff --cached --quiet && { echo "Claude made no changes"; exit 1; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "$TITLE (#$ISSUE)" -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          gh pr view "$BRANCH" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh pr create -R "$GITHUB_REPOSITORY" --head "$BRANCH" --title "$TITLE" --body-file "$body"

      - name: Move card and remove label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          TARGET: ${{ job.status == 'success' && 'In review' || 'Todo' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "$RUNNER_TEMP/set-status.sh" "$ISSUE" "$TARGET"
          if [ "$TARGET" = Todo ]; then
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Agent run failed, card moved back to Todo. Add the \`agent\` label again to retry: $RUN_URL"
          fi
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label agent
